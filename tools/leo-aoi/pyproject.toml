[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-aoi"
version = "0.1.3"
description = "Dataset-driven, reproducible AOI mosaics for LEO simulation workloads"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "rasterio==1.4.4", "shapely==2.1.2", "pyshp>=2.3,<3", "pyproj>=3.6,<4", "certifi"]

[project.scripts]
leo-aoi = "leo_aoi.cli:main"

[tool.setuptools.packages.find]
include = ["leo_aoi*"]
